apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: grupo4-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grupo4-nginx
  template:
    metadata:
      labels:
        app: grupo4-nginx
  spec:
    containers:
      - name: nginx
        image: nginx:alpine
        ports:
          - containerPort: 80
            protocol: TCP
            volumeMounts: null
          - name: html-volume
        mountPath: /usr/share/nginx/html
    volumes:
      - name: html-volume
        configMap:
          name: nginx-html
